<!DOCTYPE html>
<html lang="en" class="">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projects Redesign — Mockups</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: Inter, system-ui, sans-serif; }
  .ease-expo { transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 700ms cubic-bezier(0.22,1,0.36,1), transform 700ms cubic-bezier(0.22,1,0.36,1); }
  .reveal.in { opacity: 1; transform: none; }
  /* Generated cover: dotted grid + mesh, no emoji */
  .dotgrid { background-image: radial-gradient(currentColor 1px, transparent 1px); background-size: 18px 18px; }
  @keyframes livePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.55);} 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0);} }
  .live-dot { animation: livePulse 2s infinite; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-white transition-colors">

<!-- Control bar -->
<div class="sticky top-0 z-50 backdrop-blur-xl bg-white/80 dark:bg-gray-950/80 border-b border-gray-200 dark:border-gray-800">
  <div class="max-w-7xl mx-auto px-6 py-3 flex items-center gap-3 flex-wrap">
    <span class="text-sm font-semibold mr-2">Mockups:</span>

    <button data-tab="b" class="tab px-3 py-1.5 rounded-lg text-sm font-medium transition">B · Case studies</button>
    <button data-tab="c" class="tab px-3 py-1.5 rounded-lg text-sm font-medium transition">C · Sticky showcase</button>
    <button data-tab="d" class="tab px-3 py-1.5 rounded-lg text-sm font-medium transition">D · A layout + B content</button>
    <div class="flex-1"></div>
    <label class="text-xs text-gray-500 dark:text-gray-400 inline-flex items-center gap-2 mr-2">
      <input id="gencovers" type="checkbox" class="accent-indigo-600"> generated covers (A)
    </label>
    <button id="theme" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition">🌙 / ☀️</button>
  </div>
</div>

<!-- Shared header (cloned into each panel) -->
<template id="section-header">
  <div class="text-center mb-12 reveal">
    <h2 class="text-3xl md:text-4xl font-bold mb-6">Projects</h2>
    <p class="text-base sm:text-lg leading-relaxed text-gray-600 dark:text-gray-300 max-w-3xl mx-auto">
      Things I built <span class="font-semibold bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 dark:from-blue-300 dark:via-indigo-300 dark:to-purple-300 bg-clip-text text-transparent">outside the day job</span>:
      a <span class="font-semibold text-gray-900 dark:text-white">live algorithm practice platform</span>, two visualizers,
      an ML classifier, and a <span class="font-semibold text-gray-900 dark:text-white">first-place hackathon</span> build.
    </p>
    <p class="mt-3 text-xs text-gray-400 dark:text-gray-500 variant-note"></p>
  </div>
</template>

<!-- ============ A : FEATURED + INDEX ============ -->
<section data-panel="a" class="panel relative overflow-hidden">
  <div aria-hidden="true" class="pointer-events-none absolute -top-32 left-1/2 -translate-x-1/2 w-[48rem] h-[24rem] rounded-full bg-gradient-to-br from-blue-100/60 via-indigo-100/40 to-transparent dark:from-blue-900/20 dark:via-indigo-900/20 blur-3xl"></div>
  <div class="relative max-w-7xl mx-auto px-6 py-20">
    <div data-header="Variant A: one featured project, two media cards, and the rest as a compact index styled like the Skills rows."></div>
    <div id="a-bento" class="grid gap-6 lg:grid-cols-3 lg:grid-rows-2"></div>
    <div id="a-index" class="mt-10"></div>
    <div class="mt-10 text-center" data-gh></div>
  </div>
</section>

<!-- ============ B : CASE STUDIES ============ -->
<section data-panel="b" class="panel hidden relative overflow-hidden">
  <div aria-hidden="true" class="pointer-events-none absolute -top-32 left-1/2 -translate-x-1/2 w-[48rem] h-[24rem] rounded-full bg-gradient-to-br from-blue-100/60 via-indigo-100/40 to-transparent dark:from-blue-900/20 dark:via-indigo-900/20 blur-3xl"></div>

<!-- ============ D : A LAYOUT + B CONTENT ============ -->

  <div class="relative max-w-7xl mx-auto px-6 py-20">
    <div data-header="Variant D: A’s hierarchy with B’s storytelling. The featured project gets B’s split layout, the next two keep the full story in paired cards, and the rest go in the index."></div>
    <div id="d-bento" class="grid gap-6 lg:grid-cols-2 max-w-6xl mx-auto"></div>
    <div id="d-index" class="mt-10 max-w-6xl mx-auto"></div>
    <div class="mt-10 text-center" data-gh></div>

</section>

  <div class="max-w-7xl mx-auto px-6 py-20">
    <div data-header="Variant C: the stage pins and cross-fades between projects (same band detection as the Timeline rail). Projects without media get a generated cover."></div>
    <div class="md:grid md:grid-cols-[minmax(0,1.35fr)_minmax(0,1fr)] md:gap-14">
      <div class="hidden md:block">
        <div class="sticky top-24">
          <div class="rounded-2xl overflow-hidden ring-1 ring-gray-200/80 dark:ring-gray-700/60 bg-gray-50/80 dark:bg-gray-900/60 shadow-xl">
            <!-- browser chrome -->
            <div class="flex items-center gap-2 px-4 h-9 border-b border-gray-200/70 dark:border-gray-700/60">
              <span class="w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600"></span>
              <span id="c-url" class="ml-3 flex-1 truncate text-[11px] text-gray-400 dark:text-gray-500 font-mono"></span>
            </div>
            <div id="c-stage" class="grid aspect-[16/9]"></div>
          </div>
          <div id="c-dots" class="mt-6 flex items-center justify-center gap-2"></div>

<div class="h-24"></div>

<script>
const PUB = '../../../public/'
const DATA = [
  { id:'prepalgo', tier:'featured', title:'Prep-Algo', status:'live', year:'2023', period:'2023 — Present', role:'Solo · design → deploy',
    url:'prepalgo.com',
    outcome:'A live practice platform: write code in the browser, run it against test cases, and track progress over time.',
    problem:'Most practice sites stop at "accepted". I wanted per-test feedback and a history of how my solutions improve.',
    built:'Code execution backend, a test-case runner, and a React workspace with progress tracking backed by MongoDB.',
    result:'Live in production at prepalgo.com and used for daily practice.',
    stats:['Live','In-browser execution','Progress tracking'],
    tech:['React','Node.js','Express','MongoDB','JavaScript'],
    poster:'prep-algo-demo.png', video:'', links:{ live:'https://prepalgo.com', code:'https://github.com/arsaikia/prep-algo' } },
  { id:'pathfinding', tier:'notable', title:'Pathfinding Visualizer', year:'2022', period:'2022', role:'Solo',
    url:'github.com/arsaikia/Pathfinding_Visualizer',
    outcome:'Draw walls, drop a start and goal, and watch Dijkstra, A* and BFS race across the grid.',

    stats:['3 algorithms','Canvas API','Performance metrics'],
    tech:['JavaScript','Canvas API','HTML5','CSS3'],
    poster:'pathfinding-demo.png', video:'pathfinding-demo.mp4', links:{ code:'https://github.com/arsaikia/Pathfinding_Visualizer' } },
  { id:'algoviz', tier:'notable', title:'Algorithm Visualizer', year:'2022', period:'2022', role:'Solo',
    url:'arsaikia.github.io/AlgorithmVisualizer',
    outcome:'Step through sorting and searching algorithms and compare their performance side by side.',
    problem:'Big-O notation doesn’t show what an algorithm actually does. Learners need to see the swaps.',
    built:'A React + D3 visualizer with step-by-step execution and performance comparison across algorithms.',
    result:'Deployed on GitHub Pages as a free learning tool.',
    stats:['React + D3','Step-through','Deployed'],
    tech:['React','D3.js','JavaScript','CSS3'],
    poster:'algorithm-demo.png', video:'algorithm-demo.mp4', links:{ live:'https://arsaikia.github.io/AlgorithmVisualizer/', code:'https://github.com/arsaikia/AlgorithmVisualizer' } },
  { id:'har', tier:'archive', title:'Human Activity Recognition', year:'2021', period:'2021', role:'Capstone',
    context:'udacity', contextLabel:'Udacity', url:'github.com/arsaikia/MLND_Capstone…', mono:'HAR',
    outcome:'Classified human activities from smartphone sensor data. Capstone for Udacity’s ML Engineer Nanodegree.',
    tech:['Python','scikit-learn','Pandas','NumPy'], links:{ code:'https://github.com/arsaikia/MLND_Capstone_Human_Activity_Recognition_Using_Smartphones_Sensor_Data' } },
  { id:'ecommerce', tier:'archive', title:'Ecommerce + recommendations', year:'2021', period:'2021', role:'Term project',
    context:'iit', contextLabel:'Illinois Tech', url:'github.com/arsaikia/EWA_Term_Project', mono:'EC',
    outcome:'Ecommerce web app with a purchase recommendation system.',
    tech:['JavaScript','HTML5','CSS3','Web APIs'], links:{ code:'https://github.com/arsaikia/EWA_Term_Project' } },
  { id:'hacktober', tier:'archive', title:'Hacktober — Bit Lords', year:'2020', period:'Oct 2020', role:'Team of 5',
    award:'1st place', url:'github.com/arsaikia/Hacktober-Bit_Lords-', mono:'BL',
    outcome:'Won Code Platoon’s Hacktober 2020: helped Illinois Joining Forces gather resource-provider data and route it to Illinois veterans.',
    tech:['JavaScript','Python','CSS'], links:{ code:'https://github.com/arsaikia/Hacktober-Bit_Lords-' } },
]
// Provenance colours: same as companyAccents.ts (reserved for "where it came from")
const PROV = { udacity:{ dot:'bg-green-500', text:'text-green-600 dark:text-green-400' }, iit:{ dot:'bg-amber-500', text:'text-amber-600 dark:text-amber-400' } }

/* ---------- helpers ---------- */
const ic = {
  gh:'<svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
}
const glass = 'rounded-2xl border border-gray-200/70 dark:border-gray-700/60 bg-gray-50/80 dark:bg-gray-900/50 backdrop-blur-md shadow-sm'
const hairline = '<span aria-hidden="true" class="pointer-events-none absolute inset-x-8 top-0 h-px bg-gradient-to-r from-transparent via-indigo-400/50 to-transparent dark:via-indigo-300/40 z-10"></span>'
const focus = 'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-gray-900'

const chips = (tech, max = 4) => {
  const shown = tech.slice(0, max).map(t => `<span class="text-xs px-2 py-0.5 rounded-md bg-white/80 dark:bg-gray-800/80 text-gray-600 dark:text-gray-300 ring-1 ring-inset ring-gray-200/80 dark:ring-gray-700/60">${t}</span>`).join('')
  const more = tech.length > max ? `<span class="text-xs px-1.5 py-0.5 text-gray-400 dark:text-gray-500 tabular-nums">+${tech.length - max}</span>` : ''
  return `<div class="flex flex-wrap gap-1.5">${shown}${more}</div>`
}
const linkBtns = (p, size = 'md') => {
  const base = size === 'sm'
    ? `inline-flex items-center justify-center w-8 h-8 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-white dark:hover:bg-gray-800 transition ${focus}`
    : `inline-flex items-center gap-1.5 h-9 px-3.5 rounded-full text-sm font-medium transition ${focus}`
  const out = []
  if (p.links.live) out.push(size === 'sm'
    ? `<a href="${p.links.live}" target="_blank" rel="noopener" class="${base}" aria-label="${p.title} live site">${ic.ext}</a>`
    : `<a href="${p.links.live}" target="_blank" rel="noopener" class="${base} bg-gray-900 text-white hover:bg-gray-700 dark:bg-white dark:text-gray-900 dark:hover:bg-gray-200">${ic.ext} Live</a>`)
  if (p.links.code) out.push(size === 'sm'
    ? `<a href="${p.links.code}" target="_blank" rel="noopener" class="${base}" aria-label="${p.title} source on GitHub">${ic.gh}</a>`
    : `<a href="${p.links.code}" target="_blank" rel="noopener" class="${base} bg-white/80 dark:bg-gray-800/80 text-gray-700 dark:text-gray-200 ring-1 ring-inset ring-gray-200 dark:ring-gray-700 hover:bg-white dark:hover:bg-gray-800">${ic.gh} Code</a>`)
  return `<div class="flex items-center gap-1.5">${out.join('')}</div>`
}
const liveBadge = p => p.status === 'live'
  ? `<span class="inline-flex items-center gap-1.5 text-xs font-medium text-green-700 dark:text-green-400"><span class="w-1.5 h-1.5 rounded-full bg-green-500 live-dot"></span>Live</span>` : ''
const provBadge = p => p.context
  ? `<span class="inline-flex items-center gap-1.5 text-xs ${PROV[p.context].text}"><span class="w-2 h-2 rounded-full ${PROV[p.context].dot}"></span>${p.contextLabel}</span>`
  : p.award ? `<span class="inline-flex items-center gap-1 text-xs font-medium text-amber-700 dark:text-amber-400">${ic.trophy}${p.award}</span>` : ''

/** Generated cover: neutral Hero mesh + dotted grid + monogram. */
const genCover = p => `
  <div class="relative w-full h-full overflow-hidden bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-100 dark:from-blue-950/60 dark:via-indigo-950/60 dark:to-purple-950/60">
    <div class="absolute inset-0 dotgrid text-indigo-300/50 dark:text-indigo-400/15"></div>
    <div class="absolute -right-10 -bottom-16 w-72 h-72 rounded-full bg-gradient-to-br from-indigo-400/30 to-purple-400/20 blur-3xl"></div>
    <div class="absolute inset-0 flex flex-col items-start justify-end p-6">
      <span class="text-5xl md:text-6xl font-extrabold tracking-tight bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-600 dark:from-blue-300 dark:via-indigo-300 dark:to-purple-300 bg-clip-text text-transparent">${p.mono}</span>
      <span class="mt-2 text-xs font-mono text-gray-500 dark:text-gray-400">${p.tech.slice(0,3).join(' · ')}</span>
    </div>
    <div class="absolute top-4 right-4">${provBadge(p)}</div>
  </div>`

/** Poster + lazy video. Plays on hover AND keyboard focus; never under reduced motion. */
const media = (p, cls = '') => {
  if (!p.poster) return `<div class="${cls}">${genCover(p)}</div>`
  return `
  <div class="relative overflow-hidden ${cls}">
    <img src="${PUB}${p.poster}" alt="" loading="lazy" class="absolute inset-0 w-full h-full object-cover object-top transition duration-700 ease-expo group-hover:scale-[1.03]">
    ${p.video ? `<video data-src="${PUB}${p.video}" muted loop playsinline preload="none" class="absolute inset-0 w-full h-full object-cover object-top opacity-0 transition-opacity duration-500"></video>
    <span class="absolute left-3 bottom-3 inline-flex items-center gap-1 px-2 py-1 rounded-full bg-black/55 text-white text-[11px] font-medium backdrop-blur-sm transition-opacity duration-300 group-hover:opacity-0 group-focus-within:opacity-0">${ic.play} Preview</span>` : ''}
    <div class="absolute inset-0 ring-1 ring-inset ring-black/5 dark:ring-white/5"></div>
  </div>`
}

const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
const playV = v => { if (!v.src) v.src = v.dataset.src; v.play().then(() => v.style.opacity = 1).catch(() => {}) }
const stopV = v => { v.style.opacity = 0; v.pause() }
function wireVideo(card) {
  const v = card.querySelector('video'); if (!v || reducedMotion) return
  card.addEventListener('mouseenter', () => playV(v)); card.addEventListener('mouseleave', () => stopV(v))
  card.addEventListener('focusin', () => playV(v)); card.addEventListener('focusout', e => { if (!card.contains(e.relatedTarget)) stopV(v) })
}

/** Index rows: the Skills-row idiom (year · title · one-liner · provenance · links). */
const indexPanel = items => `
  <div class="relative ${glass} overflow-hidden reveal">
    ${hairline}
    <div class="flex items-baseline justify-between px-6 sm:px-7 pt-6 pb-2">
      <h3 class="text-lg font-semibold">More work</h3>
      <span class="text-xs tabular-nums text-gray-400 dark:text-gray-500">${items.length}</span>
    </div>
    <ul class="px-6 sm:px-7 pb-4 divide-y divide-gray-200/70 dark:divide-gray-700/50">
      ${items.map(p => `
      <li class="group/row grid grid-cols-[3rem_1fr_auto] sm:grid-cols-[3.5rem_1fr_auto_auto] items-start sm:items-center gap-x-4 gap-y-1 py-4">
        <time class="text-xs tabular-nums text-gray-400 dark:text-gray-500 pt-0.5 sm:pt-0">${p.year}</time>
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
            <h4 class="text-[0.95rem] font-medium text-gray-800 dark:text-gray-200 group-hover/row:text-gray-900 dark:group-hover/row:text-white">${p.title}</h4>
            ${provBadge(p)}
          </div>
          <p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">${p.outcome}</p>
        </div>
        <div class="hidden sm:block">${chips(p.tech, 2)}</div>
        ${linkBtns(p, 'sm')}
      </li>`).join('')}
    </ul>
  </div>`

const ghLink = `<a href="https://github.com/arsaikia" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-sm font-medium text-indigo-600 dark:text-indigo-300 hover:text-indigo-800 dark:hover:text-indigo-200 ${focus} rounded">${ic.gh} Everything else is on GitHub →</a>`

document.querySelectorAll('[data-header]').forEach(slot => {
  const node = document.getElementById('section-header').content.cloneNode(true)
  node.querySelector('.variant-note').textContent = slot.dataset.header
  slot.replaceWith(node)
})
document.querySelectorAll('[data-gh]').forEach(n => n.innerHTML = ghLink)

const featured = DATA.filter(p => p.tier === 'featured')
const notable = DATA.filter(p => p.tier === 'notable')
const archive = DATA.filter(p => p.tier === 'archive')

function observeReveals() {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: 0.15 })
  document.querySelectorAll('.panel:not(.hidden) .reveal:not(.in)').forEach(n => io.observe(n))
}

/* ---------- A ---------- */
function renderA() {
  const gen = document.getElementById('gencovers').checked
  const f = featured[0]
  const featuredCard = `
  <article class="group relative ${glass} overflow-hidden lg:col-span-2 lg:row-span-2 flex flex-col hover:shadow-xl hover:border-gray-300/80 dark:hover:border-gray-600/70 transition-all duration-500 ease-expo reveal">
    ${hairline}
    ${media(f, 'aspect-[16/9] lg:aspect-auto lg:flex-1 lg:min-h-[320px]')}
    <div class="p-6 sm:p-8">
      <div class="flex flex-wrap items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
        <span class="uppercase tracking-wider font-semibold text-indigo-600 dark:text-indigo-300">Featured</span>
        <span class="w-px h-3 bg-gray-300 dark:bg-gray-600"></span>${liveBadge(f)}
        <span class="w-px h-3 bg-gray-300 dark:bg-gray-600"></span><time class="tabular-nums">${f.period}</time>
        <span class="hidden sm:inline">· ${f.role}</span>
      </div>
      <div class="mt-3 flex flex-wrap items-end justify-between gap-4">
        <div class="max-w-xl">
          <h3 class="text-2xl sm:text-3xl font-bold tracking-tight">${f.title}</h3>
          <p class="mt-2 text-gray-600 dark:text-gray-300 leading-relaxed">${f.outcome}</p>
        </div>
        ${linkBtns(f)}
      </div>
      <div class="mt-5">${chips(f.tech, 5)}</div>
    </div>
  </article>`
  const notableCards = notable.map((p, i) => `
  <article class="group relative ${glass} overflow-hidden flex flex-col hover:shadow-xl hover:-translate-y-0.5 hover:border-gray-300/80 dark:hover:border-gray-600/70 transition-all duration-500 ease-expo reveal" style="transition-delay:${(i + 1) * 90}ms">
    ${hairline}
    ${gen ? `<div class="aspect-[16/8]">${genCover({ ...p, mono: p.title.split(' ').map(w => w[0]).join('') })}</div>` : media(p, 'aspect-[16/8]')}
    <div class="p-5 flex-1 flex flex-col">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 class="text-lg font-semibold">${p.title}</h3>
          <time class="text-xs tabular-nums text-gray-400 dark:text-gray-500">${p.period} · ${p.role}</time>
        </div>
        ${linkBtns(p, 'sm')}
      </div>
      <p class="mt-2 text-sm text-gray-600 dark:text-gray-300 leading-relaxed flex-1">${p.outcome}</p>
      <div class="mt-4">${chips(p.tech, 3)}</div>
    </div>
  </article>`).join('')
  document.getElementById('a-bento').innerHTML = featuredCard + notableCards
  document.getElementById('a-index').innerHTML = indexPanel(archive)
  document.querySelectorAll('#a-bento article').forEach(wireVideo)
  observeReveals()
}

/* ---------- B ---------- */
const block = (label, text, marker) => `
  <div class="relative pl-5">
    <span aria-hidden="true" class="absolute left-0 top-1.5 w-2 h-2 rotate-45 rounded-[2px] ${marker}"></span>
    <h4 class="text-[11px] uppercase tracking-wider font-semibold text-gray-400 dark:text-gray-500">${label}</h4>
    <p class="mt-1 text-sm leading-relaxed text-gray-700 dark:text-gray-300">${text}</p>
  </div>`
document.getElementById('b-cases').innerHTML = [...featured, ...notable].map((p, i) => {
  const flip = i % 2 === 1
  return `
  <li class="reveal">
    <article class="group grid md:grid-cols-12 gap-8 md:gap-12 items-center">
      <div class="md:col-span-7 ${flip ? 'md:order-2' : ''}">
        <div class="relative ${glass} overflow-hidden p-2">
          ${hairline}
          <div class="rounded-xl overflow-hidden">${media(p, 'aspect-[16/10]')}</div>
        </div>
      </div>
      <div class="md:col-span-5 ${flip ? 'md:order-1' : ''}">
        <div class="flex items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
          <span class="tabular-nums font-semibold text-gray-400 dark:text-gray-500">0${i + 1}</span>
          <span class="w-6 h-px bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></span>
          <time class="tabular-nums">${p.period}</time>${liveBadge(p)}
        </div>
        <h3 class="mt-3 text-2xl sm:text-3xl font-bold tracking-tight">${p.title}</h3>
        <div class="mt-4 flex flex-wrap gap-2">
          ${p.stats.map(s => `<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 ring-1 ring-inset ring-indigo-100 dark:bg-indigo-500/10 dark:text-indigo-300 dark:ring-indigo-400/20">${s}</span>`).join('')}
        </div>
        <div class="mt-6 space-y-4">
          ${block('Problem', p.problem, 'border-[1.5px] border-gray-300 dark:border-gray-600')}
          ${block('What I built', p.built, 'border-[1.5px] border-indigo-400')}
          ${block('Outcome', p.result, 'bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-500')}
        </div>
        <div class="mt-6 flex flex-wrap items-center justify-between gap-4">
          ${chips(p.tech, 4)}
          ${linkBtns(p)}
        </div>
      </div>
    </article>
  </li>`
}).join('')
document.querySelectorAll('#b-cases article').forEach(wireVideo)
document.getElementById('b-index').innerHTML = indexPanel(archive)

/* ---------- C ---------- */
const stage = document.getElementById('c-stage')
stage.innerHTML = DATA.map((p, i) => `
  <div data-slide="${i}" class="col-start-1 row-start-1 transition-all duration-[600ms] ease-expo opacity-0 scale-[0.97]">
    ${p.poster
      ? `<div class="relative w-full h-full"><img src="${PUB}${p.poster}" alt="" class="absolute inset-0 w-full h-full object-cover object-top">${p.video ? `<video data-src="${PUB}${p.video}" muted loop playsinline preload="none" class="absolute inset-0 w-full h-full object-cover object-top opacity-0 transition-opacity duration-500"></video>` : ''}</div>`
      : genCover(p)}
  </div>`).join('')
const DOT_ON = ['w-8', 'bg-gradient-to-r', 'from-blue-500', 'via-indigo-500', 'to-purple-500']
const DOT_OFF = ['w-2', 'bg-gray-300', 'dark:bg-gray-600', 'hover:bg-gray-400']
document.getElementById('c-dots').innerHTML = DATA.map((p, i) => `
  <button data-dot="${i}" aria-label="Jump to ${p.title}" class="h-2 rounded-full transition-all duration-500 ease-expo ${focus} ${DOT_OFF.join(' ')}"></button>`).join('')
document.getElementById('c-items').innerHTML = DATA.map((p, i) => `
  <li data-item="${i}" class="md:min-h-[72vh] md:flex md:items-center">
    <article class="w-full transition-opacity duration-500 ease-expo" data-art>
      <div class="md:hidden mb-4 rounded-xl overflow-hidden ${glass}">${media(p, 'aspect-[16/9]')}</div>
      <div class="flex flex-wrap items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
        <span class="tabular-nums font-semibold text-gray-400 dark:text-gray-500">0${i + 1} / 0${DATA.length}</span>
        <time class="tabular-nums">${p.period}</time>
        ${liveBadge(p)}${provBadge(p)}
      </div>
      <h3 class="mt-3 text-2xl md:text-3xl font-bold tracking-tight">${p.title}</h3>
      <p class="mt-3 text-gray-600 dark:text-gray-300 leading-relaxed">${p.outcome}</p>
      ${p.built ? `<p class="mt-3 text-sm text-gray-500 dark:text-gray-400 leading-relaxed">${p.built}</p>` : ''}
      <div class="mt-5">${chips(p.tech, 4)}</div>
      <div class="mt-5">${linkBtns(p)}</div>
    </article>
  </li>`).join('')

let cActive = -1
function setActiveC(i) {
  if (i === cActive) return
  cActive = i
  document.getElementById('c-url').textContent = DATA[i].url
  stage.querySelectorAll('[data-slide]').forEach(s => {
    const on = +s.dataset.slide === i
    s.classList.toggle('opacity-100', on); s.classList.toggle('scale-100', on)
    s.classList.toggle('opacity-0', !on); s.classList.toggle('scale-[0.97]', !on)
    const v = s.querySelector('video')
    if (v && !reducedMotion) on ? playV(v) : stopV(v)
  })
  document.querySelectorAll('[data-dot]').forEach(d => {
    const on = +d.dataset.dot === i
    d.classList.remove(...DOT_ON, ...DOT_OFF); d.classList.add(...(on ? DOT_ON : DOT_OFF))
    d.setAttribute('aria-current', on ? 'true' : 'false')
  })
  if (matchMedia('(min-width: 768px)').matches)
    document.querySelectorAll('[data-item]').forEach(li => li.querySelector('[data-art]').style.opacity = +li.dataset.item === i ? 1 : 0.35)
}
const cIO = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && setActiveC(+e.target.dataset.item)),
  { rootMargin: '-45% 0px -45% 0px' })
document.querySelectorAll('[data-item]').forEach(li => cIO.observe(li))
document.querySelectorAll('[data-dot]').forEach(d => d.addEventListener('click', () =>
  document.querySelector(`[data-item="${d.dataset.dot}"]`).scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center' })))
setActiveC(0)

/* ---------- D : A layout + B content ---------- */
const statPills = (p, limit = 3) => `<div class="flex flex-wrap gap-2">${p.stats.slice(0, limit).map(s => `<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 ring-1 ring-inset ring-indigo-100 dark:bg-indigo-500/10 dark:text-indigo-300 dark:ring-indigo-400/20">${s}</span>`).join('')}</div>`
const story = p => `
  ${block('Problem', p.problem, 'border-[1.5px] border-gray-300 dark:border-gray-600')}
  ${block('What I built', p.built, 'border-[1.5px] border-indigo-400')}
  ${block('Outcome', p.result, 'bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-500')}`
function renderD() {
  const gen = document.getElementById('gencovers').checked
  const f = featured[0]
  const eyebrow = (p, n, extra = '') => `
      <div class="flex flex-wrap items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
        <span class="tabular-nums font-semibold text-gray-400 dark:text-gray-500">0${n}</span>
        <span class="w-6 h-px bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></span>
        ${extra}<time class="tabular-nums">${p.period}</time>${liveBadge(p)}
      </div>`
  const featuredCard = `
  <article class="group relative ${glass} overflow-hidden lg:col-span-2 p-2 sm:p-3 hover:shadow-xl hover:border-gray-300/80 dark:hover:border-gray-600/70 transition-all duration-500 ease-expo reveal">
    ${hairline}
    <div class="grid md:grid-cols-12 gap-6 md:gap-10 items-center">
      <div class="md:col-span-7 rounded-xl overflow-hidden">${media(f, 'aspect-[16/10]')}</div>
      <div class="md:col-span-5 px-4 pb-5 md:px-0 md:py-6 md:pr-6">
        ${eyebrow(f, 1, '<span class="uppercase tracking-wider font-semibold text-indigo-600 dark:text-indigo-300">Featured</span>')}
        <h3 class="mt-3 text-2xl sm:text-3xl font-bold tracking-tight">${f.title}</h3>
        <div class="mt-4">${statPills(f, 3)}</div>
        <div class="mt-6 space-y-4">${story(f)}</div>
        <div class="mt-6 flex flex-wrap items-center justify-between gap-4">
          ${chips(f.tech, 3)}
          ${linkBtns(f)}
        </div>
      </div>
    </div>
  </article>`
  const notableCards = notable.map((p, i) => `
  <article class="group relative ${glass} overflow-hidden p-2 flex flex-col hover:shadow-xl hover:-translate-y-0.5 hover:border-gray-300/80 dark:hover:border-gray-600/70 transition-all duration-500 ease-expo reveal" style="transition-delay:${(i + 1) * 90}ms">
    ${hairline}
    <div class="rounded-xl overflow-hidden">${gen ? `<div class="aspect-[16/9]">${genCover({ ...p, mono: p.title.split(' ').map(w => w[0]).join('') })}</div>` : media(p, 'aspect-[16/9]')}</div>
    <div class="px-4 pt-5 pb-4 flex-1 flex flex-col">
      ${eyebrow(p, i + 2)}
      <h3 class="mt-3 text-xl sm:text-2xl font-bold tracking-tight">${p.title}</h3>
      <div class="mt-3">${statPills(p, 2)}</div>
      <p class="mt-5 text-sm leading-relaxed text-gray-700 dark:text-gray-300 flex-1">${p.outcome}</p>
      <details class="mt-4 group/d">
        <summary class="cursor-pointer list-none inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-300 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded">
          <svg class="w-3 h-3 transition-transform duration-300 ease-expo group-open/d:rotate-90" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M7 5l6 5-6 5V5z"/></svg>
          <span class="group-open/d:hidden">View case study</span><span class="hidden group-open/d:inline">Hide case study</span>
        </summary>
        <div class="mt-4 space-y-4">${story(p)}</div>
      </details>
      <div class="mt-6 flex flex-wrap items-center justify-between gap-4">
        ${chips(p.tech, 3)}
        ${linkBtns(p, 'sm')}
      </div>
    </div>
  </article>`).join('')
  document.getElementById('d-bento').innerHTML = featuredCard + `<div class="lg:col-span-2 grid gap-6 md:grid-cols-2">${notableCards}</div>`
  document.getElementById('d-index').innerHTML = indexPanel(archive)
  document.querySelectorAll('#d-bento article').forEach(wireVideo)
  observeReveals()
}

/* ---------- tabs, theme ---------- */
document.getElementById('gencovers').addEventListener('change', () => { renderA(); renderD() })
renderA()
renderD()
const tabs = document.querySelectorAll('.tab')
function show(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== id))
  tabs.forEach(t => t.className = 'tab px-3 py-1.5 rounded-lg text-sm font-medium transition ' + (t.dataset.tab === id ? 'bg-gray-900 text-white dark:bg-white dark:text-gray-900' : 'hover:bg-gray-100 dark:hover:bg-gray-800'))
  history.replaceState(null, '', '#' + id)
  observeReveals()
}
tabs.forEach(t => t.addEventListener('click', () => show(t.dataset.tab)))
show(['a', 'b', 'c', 'd'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a')
const root = document.documentElement
if (localStorage.theme === 'dark' || (!localStorage.theme && matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark')
document.getElementById('theme').addEventListener('click', () => { root.classList.toggle('dark'); localStorage.theme = root.classList.contains('dark') ? 'dark' : 'light' })
</script>
</body>
</html>
